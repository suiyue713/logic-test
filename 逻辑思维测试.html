<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>逻辑思维测试 · 三档难度</title>
<style>
:root{
  --bg0:#070b18; --bg1:#0d1430; --card:rgba(20,30,66,.72); --line:rgba(120,150,255,.18);
  --cyan:#35e6ff; --violet:#8b6bff; --blue:#5b6cff; --good:#2fe6a8; --bad:#ff5d7a;
  --txt:#eef2ff; --sub:#9fb0e0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--txt);background:radial-gradient(1200px 700px at 50% -10%,#1b2b6b 0%,var(--bg1) 38%,var(--bg0) 100%);
  min-height:100vh;overflow-x:hidden;user-select:none;
}
#bgGlow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(420px 420px at 18% 22%,rgba(91,108,255,.20),transparent 60%),
            radial-gradient(480px 480px at 85% 78%,rgba(139,107,255,.18),transparent 60%),
            radial-gradient(360px 360px at 60% 12%,rgba(53,230,255,.10),transparent 60%)}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 16px 40px}

/* ---------- HUD ---------- */
.hud{display:none}
.hud.show{display:block}
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--sub);backdrop-filter:blur(8px)}
.pill b{color:#fff;font-size:15px}
.timer{font-variant-numeric:tabular-nums;color:var(--cyan);font-weight:700}
.lvl-tag{font-size:12px;padding:4px 10px;border-radius:999px;font-weight:700}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:16px}
.bar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .35s ease;box-shadow:0 0 12px rgba(53,230,255,.6)}

/* ---------- Card / question ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 18px;backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(0,0,0,.35)}
.qtype{display:inline-block;font-size:12px;color:var(--cyan);border:1px solid rgba(53,230,255,.4);padding:3px 12px;border-radius:99px;margin-bottom:14px;background:rgba(53,230,255,.08)}
.qtitle{font-size:19px;line-height:1.65;font-weight:700;margin-bottom:20px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px;line-height:1.5;cursor:pointer;transition:.15s;background:rgba(255,255,255,.03)}
.opt .key{flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:14px;background:rgba(255,255,255,.08);color:var(--sub)}
.opt .txt{flex:1;white-space:pre-wrap}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--cyan);background:rgba(53,230,255,.10);box-shadow:0 0 0 1px rgba(53,230,255,.35) inset}
.opt.sel .key{background:var(--cyan);color:#04222b}
.navrow{display:flex;gap:12px;margin-top:22px}
.btn{flex:1;border:none;cursor:pointer;border-radius:14px;padding:15px;font-size:16px;font-weight:700;color:#fff;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-ghost{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--sub)}
.btn-ghost:disabled{opacity:.35}
.btn-main{background:linear-gradient(135deg,var(--blue),var(--violet));box-shadow:0 10px 26px rgba(91,108,255,.4)}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:26px 22px;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:radial-gradient(900px 600px at 50% -10%,rgba(91,108,255,.25),transparent 60%),rgba(5,8,20,.82);backdrop-filter:blur(8px);overflow-y:auto}
.overlay.hide{display:none}
.panel{width:100%;max-width:520px;text-align:center;margin:auto 0}
.logo-kicker{letter-spacing:6px;color:var(--cyan);font-size:12px;margin-bottom:14px}
.title{font-size:40px;font-weight:900;line-height:1.15;margin-bottom:8px;
  background:linear-gradient(180deg,#fff 20%,#9fb6ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(120,140,255,.35)}
.subtitle{color:var(--sub);font-size:14px;margin-bottom:24px}
.rules{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:22px;font-size:14px;line-height:1.9;color:var(--sub)}
.rules b{color:var(--txt)}

/* mode cards */
.modes{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.mode{position:relative;display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:rgba(255,255,255,.03);cursor:pointer;transition:.15s;overflow:hidden}
.mode:active{transform:scale(.98)}
.mode .m-ico{font-size:30px;flex:0 0 46px;height:46px;display:grid;place-items:center;border-radius:12px}
.mode .m-name{font-size:18px;font-weight:800}
.mode .m-sub{font-size:12.5px;color:var(--sub);margin-top:2px}
.mode .m-best{margin-left:auto;font-size:12px;color:var(--cyan);font-weight:700;white-space:nowrap}
.mode.easy .m-ico{background:rgba(47,230,168,.14)}
.mode.normal .m-ico{background:rgba(91,108,255,.18)}
.mode.hard .m-ico{background:rgba(255,93,122,.14)}
.mode.easy{border-color:rgba(47,230,168,.35)}
.mode.normal{border-color:rgba(91,108,255,.4)}
.mode.hard{border-color:rgba(255,93,122,.35)}

.bigbtn{display:block;width:100%;border:none;cursor:pointer;border-radius:16px;padding:18px;font-size:18px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--cyan),var(--blue) 55%,var(--violet));box-shadow:0 16px 40px rgba(91,108,255,.5)}
.bigbtn:active{transform:scale(.98)}
.hint{margin-top:14px;font-size:12px;color:#6f7fb0}

/* ---------- Result ---------- */
.ring{position:relative;width:188px;height:188px;margin:6px auto 14px}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:52px;font-weight:900;line-height:1}
.ring .num span{font-size:12px;color:var(--sub);margin-top:4px}
.grade-name{font-size:26px;font-weight:900;margin:4px 0}
.grade-desc{color:var(--sub);font-size:14px;line-height:1.7;margin-bottom:14px}
.rtags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px}
.tag{font-size:12.5px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--sub)}
.tag.hot{color:#fff;border-color:rgba(53,230,255,.5);background:rgba(53,230,255,.12)}
.sec-h{font-size:15px;font-weight:800;margin:22px 0 12px;display:flex;align-items:center;gap:8px}
.sec-h::before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(var(--cyan),var(--violet))}
.ability{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.ability .an{flex:0 0 78px;font-size:13px;color:var(--sub)}
.ability .track{flex:1;height:9px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.ability .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--violet))}
.ability.good .track i{background:linear-gradient(90deg,#2fe6a8,#35e6ff)}
.ability.bad .track i{background:linear-gradient(90deg,#ff5d7a,#ff9a6b)}
.ability .av{flex:0 0 44px;text-align:right;font-size:12.5px;color:var(--sub)}
.ability .acm{flex:0 0 150px;font-size:11.5px;color:#8fa0d0;line-height:1.4;text-align:right}

.review{display:flex;flex-direction:column;gap:12px}
.ritem{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.03);text-align:left}
.ritem.ok{border-color:rgba(47,230,168,.3)}
.ritem.no{border-color:rgba(255,93,122,.32)}
.rhead{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:9px}
.rhead .rk{font-weight:800}
.rhead .rt2{color:var(--sub);font-size:12px}
.rhead .rs{margin-left:auto;font-weight:800;font-size:12.5px}
.ok .rhead .rs{color:var(--good)}
.no .rhead .rs{color:var(--bad)}
.rq{font-size:15px;font-weight:700;line-height:1.6;margin-bottom:9px;white-space:pre-wrap}
.rop{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:7px 10px;border-radius:9px;margin-bottom:6px;color:var(--sub);white-space:pre-wrap}
.rop .lk{font-weight:800}
.rop.isAns{background:rgba(47,230,168,.12);color:#b9ffe6}
.rop.isPick{background:rgba(255,93,122,.14);color:#ffd2da}
.why{font-size:12.5px;color:#aebbe6;line-height:1.7;margin-top:6px;padding-top:8px;border-top:1px dashed rgba(255,255,255,.1)}
.why b{color:var(--cyan)}
.resbtns{display:flex;gap:12px;margin-top:24px}
.foot{margin-top:16px;font-size:12px;color:#6f7fb0;line-height:1.7}
.toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%) translateY(20px);z-index:50;background:rgba(10,16,40,.95);border:1px solid var(--line);padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;text-align:center;max-width:88%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="bgGlow"></div>
<div class="wrap">
  <!-- 答题HUD -->
  <div class="hud" id="hud">
    <div class="hud-top">
      <div class="pill">第 <b id="qNo">1</b>/<b id="qTotal">10</b> 题</div>
      <div class="pill lvl-tag" id="lvlTag">一般</div>
      <div class="pill timer" id="timer">00:00</div>
    </div>
    <div class="bar"><i id="progress"></i></div>
    <div class="card">
      <span class="qtype" id="qType"></span>
      <div class="qtitle" id="qTitle"></div>
      <div class="opts" id="optBox"></div>
      <div class="navrow">
        <button class="btn btn-ghost" id="btnPrev">上一题</button>
        <button class="btn btn-main" id="btnNext">下一题</button>
      </div>
    </div>
  </div>
</div>

<!-- 开始页 -->
<div class="overlay" id="start">
  <div class="panel">
    <div class="logo-kicker">BRAIN POWER TEST</div>
    <div class="title">逻辑<br>思维测试</div>
    <div class="subtitle">三档难度 · 选一个开始你的脑力闯关 🧠</div>

    <div class="modes" id="modeBox"></div>

    <div class="rules">
      📝 每题只有一个最佳答案，可点<b>「上一题」</b>回改<br>
      ⏱️ 计时但<b>不限时</b>，独立完成，不查资料、不用计算器<br>
      🏆 交卷立即出<b>百分制评分、速度星级、脑力标签、逐项点评和提升建议</b><br>
      🎯 趣味逻辑测验，非医学标准化智商量表，放轻松就好
    </div>
    <button class="bigbtn" id="btnStart" disabled style="opacity:.5">请先选择难度</button>
    <div class="hint">三档最高分分别记录，先从「简单」热身也完全 OK 👆</div>
  </div>
</div>

<!-- 结果页 -->
<div class="overlay hide" id="result">
  <div class="panel">
    <div class="logo-kicker" id="rKicker">RESULT</div>
    <div class="ring">
      <svg width="188" height="188" viewBox="0 0 188 188">
        <circle cx="94" cy="94" r="82" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="14"/>
        <circle id="ringFg" cx="94" cy="94" r="82" fill="none" stroke="url(#g1)" stroke-width="14" stroke-linecap="round" stroke-dasharray="515" stroke-dashoffset="515"/>
        <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#35e6ff"/><stop offset="1" stop-color="#8b6bff"/>
        </linearGradient></defs>
      </svg>
      <div class="num"><b id="rScore">0</b><span id="rSub">满分 100 · 0/0 正确</span></div>
    </div>
    <div class="grade-name" id="rGrade">—</div>
    <div class="grade-desc" id="rDesc"></div>
    <div class="rtags" id="rTags"></div>

    <div class="sec-h">综合评分报告</div>
    <div class="card" style="text-align:left">
      <div class="ability"><div class="an">反应速度</div><div class="track"><i id="speedBar" style="width:0%"></i></div><div class="av" id="speedText">—</div></div>
      <div id="abilityBox"></div>
    </div>

    <div class="sec-h" id="adviceTitle">给你的评价</div>
    <div class="card" id="adviceBox" style="text-align:left;font-size:14px;line-height:1.9;color:#c6d2f5"></div>

    <div class="sec-h">逐题解析</div>
    <div class="review" id="reviewBox"></div>

    <div class="resbtns">
      <button class="btn btn-ghost" id="btnHome">返回选关</button>
      <button class="btn btn-main" id="btnAgain">再测一次</button>
    </div>
    <div style="display:flex;gap:12px;margin-top:12px">
      <button class="bigbtn" id="btnShare" style="margin-top:0;flex:1">📤 分享成绩</button>
      <button class="bigbtn" id="btnPoster" style="margin-top:0;flex:1;background:linear-gradient(135deg,#00d4ff,#7a4dff)">🖼 成绩海报</button>
    </div>
    <div class="foot">趣味逻辑测验 · 成绩仅保存在本设备浏览器</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 成绩海报弹层 -->
<div class="overlay hide" id="posterMask" style="z-index:40;padding:20px">
  <div class="panel" style="max-width:420px">
    <canvas id="posterCanvas" width="750" height="1334" style="width:100%;border-radius:18px;display:block;box-shadow:0 18px 50px rgba(0,0,0,.5)"></canvas>
    <div style="display:flex;gap:12px;margin-top:18px">
      <button class="btn btn-ghost" id="btnPosterClose" style="flex:1">关闭</button>
      <button class="btn btn-main" id="btnPosterSave" style="flex:1">⬇️ 保存海报</button>
    </div>
    <div class="foot" style="margin-top:10px">手机可长按图片保存；电脑点“保存海报”下载</div>
  </div>
</div>

<script id="qdata" type="application/json">
{
  "levels": [
    {
      "key":"easy","name":"简单","sub":"热身入门 · 10 题 · 轻松找规律","color":"#2fe6a8","seconds":420,
      "questions":[
        {"type":"数字规律","title":"2，4，8，16，（ ）","options":["24","30","32","64"],"answer":2,"explain":"后一个数都是前一个的 2 倍，16×2 = 32。"},
        {"type":"类比推理","title":"手 之于 手套，相当于 脚 之于（ ）","options":["鞋子","袜子","帽子","腰带"],"answer":1,"explain":"手套直接套在手上，袜子直接套在脚上，贴身穿戴的对应最贴切。"},
        {"type":"类比推理","title":"医生 之于 医院，相当于 教师 之于（ ）","options":["学生","学校","课本","课堂"],"answer":1,"explain":"医生在医院工作，教师在学校工作，是“职业∶工作场所”的关系。"},
        {"type":"数字规律","title":"1，4，9，16，25，（ ）","options":["30","33","36","49"],"answer":2,"explain":"依次是 1²、2²、3²、4²、5²，下一个是 6² = 36。"},
        {"type":"类比推理","title":"温度计 之于 温度，相当于 钟表 之于（ ）","options":["时间","秒针","挂钟","手表"],"answer":0,"explain":"温度计测量温度，钟表测量/显示时间，是“工具∶测量对象”。"},
        {"type":"数字规律","title":"1，3，5，7，（ ）","options":["8","9","10","11"],"answer":1,"explain":"连续奇数，每次 +2，7 后面是 9。"},
        {"type":"逻辑推理","title":"“如果下雨，地面就会湿。”现在地面是湿的，能确定一定下过雨吗？","options":["一定下过雨","一定没下雨","不一定，也可能是洒水等原因","地面不会湿"],"answer":2,"explain":"下雨是地湿的充分条件，却不是必要条件，地湿还可能是洒水车、泼水造成。"},
        {"type":"类比推理","title":"苹果 之于 水果，相当于 玫瑰 之于（ ）","options":["花朵","花园","花瓣","红色"],"answer":0,"explain":"苹果属于水果，玫瑰属于花朵，是“个体∶所属类别”的关系。"},
        {"type":"数字规律","title":"3，6，9，12，（ ）","options":["13","14","15","16"],"answer":2,"explain":"每次 +3 的等差数列，12 后面是 15。"},
        {"type":"演绎推理","title":"哥哥比弟弟年龄大，弟弟比妹妹年龄大。三人中年龄最小的是？","options":["哥哥","弟弟","妹妹","无法确定"],"answer":2,"explain":"哥哥 > 弟弟 > 妹妹，所以妹妹最小。"}
      ]

    {
      "key":"normal","name":"一般","sub":"标准挑战 · 10 题 · 小心直觉陷阱","color":"#5b6cff","seconds":900,
      "questions":[
        {"type":"数字规律","title":"2，6，12，20，30，（ ）","options":["36","40","42","44"],"answer":2,"explain":"规律是 n(n+1)：1×2、2×3、3×4……第 6 项 6×7 = 42。"},
        {"type":"数字规律","title":"1，1，2，3，5，8，（ ）","options":["11","12","13","15"],"answer":2,"explain":"从第 3 项起每项等于前两项之和（斐波那契数列），5+8 = 13。"},
        {"type":"数字规律","title":"2，3，5，9，17，（ ）","options":["25","29","31","33"],"answer":3,"explain":"相邻差依次是 1、2、4、8，都在翻倍，下一个差是 16，17+16 = 33。"},
        {"type":"直觉陷阱","title":"一支球拍和一颗球一共 11 元，球拍比球贵 10 元。球多少钱？","options":["1 元","0.5 元","10 元","10.5 元"],"answer":1,"explain":"设球 x 元，球拍 x+10 元，x+(x+10)=11，得 x=0.5。第一眼的“1 元”是直觉陷阱。"},
        {"type":"直觉陷阱","title":"5 台机器 5 分钟生产 5 个零件。100 台机器生产 100 个零件需要几分钟？","options":["1 分钟","5 分钟","20 分钟","100 分钟"],"answer":1,"explain":"1 台机器做 1 个零件就要 5 分钟。100 台同时开工，5 分钟各做 1 个，仍是 5 分钟。"},
        {"type":"逻辑推理","title":"已知“有些画家是教师，有些教师是医生”。能否确定“有些画家一定是医生”？","options":["一定正确","一定错误","无法确定","所有画家都是医生"],"answer":2,"explain":"两个“有些”重叠的群体不一定相交，画家与医生可能完全不沾边，故无法确定。"},

        {"type":"演绎推理","title":"一个房间有 27 个人，他们中至少有几个人的生日在同一个月份？","options":["2 人","3 人","4 人","6 人"],"answer":1,"explain":"27 人分到 12 个月，27÷12=2 余 3，最平均也有月份分到 3 人（抽屉原理）。"},
        {"type":"演绎推理","title":"甲、乙、丙职业分别是教师、医生、工程师（顺序打乱）。已知：①丙比工程师年龄大；②甲和医生不是同岁；③医生比乙年龄小。请问甲是做什么的？","options":["教师","医生","工程师","无法确定"],"answer":2,"explain":"由②③知医生既不是甲也不是乙，故医生是丙；由①丙>工程师，由③乙>丙=医生，故乙不是工程师，乙是教师，甲只能是工程师。"},
        {"type":"逻辑推理","title":"所有的 A 都是 B，所有的 B 都是 C。能否推出“所有的 A 都是 C”？","options":["能","不能","无法确定","只有部分 A 是 C"],"answer":0,"explain":"集合包含可传递：A⊆B 且 B⊆C，则 A⊆C，所以所有 A 都是 C。"}
      ]
    },
    {
      "key":"hard","name":"困难","sub":"烧脑大师 · 10 题 · 高手进阶","color":"#ff5d7a","seconds":1200,
      "questions":[
        {"type":"直觉陷阱","title":"池塘里的睡莲每天面积翻倍，第 48 天刚好盖满整个池塘。盖满半个池塘是第几天？","options":["第 24 天","第 46 天","第 47 天","第 48 天"],"answer":2,"explain":"每天翻倍意味着前一天正好是一半，盖满是第 48 天，一半就是第 47 天，不是 24 天。"},
        {"type":"直觉陷阱","title":"一只股票先上涨 10%，再下跌 10%。和最初相比结果如何？","options":["不赚不亏","赚了约 1%","亏了约 1%","亏了 10%"],"answer":2,"explain":"设原价 100，涨后 110，再跌 10% 是 110×0.9=99，比原价少 1%。涨和跌的基数不同。"},
        {"type":"数字规律","title":"1，2，6，24，120，（ ）","options":["240","480","600","720"],"answer":3,"explain":"依次 ×2、×3、×4、×5，下一个 ×6，120×6 = 720（阶乘数列）。"},
        {"type":"空间想象","title":"3 点整时，钟面上时针和分针的较小夹角是多少度？","options":["60°","90°","120°","180°"],"answer":1,"explain":"分针指向 12、时针指向 3，相差 3 个大格，每格 30°，3×30 = 90°。"},
        {"type":"数字规律","title":"1，3，4，7，11，（ ）","options":["14","16","18","20"],"answer":2,"explain":"从第 3 项起每项等于前两项之和：4=1+3、7=3+4、11=4+7，下一个 7+11 = 18。"},
        {"type":"演绎推理","title":"甲比乙大 3 岁，乙比丙小 2 岁。甲和丙谁年龄大？","options":["甲大","丙大","一样大","无法确定"],"answer":0,"explain":"甲=乙+3，丙=乙+2，所以甲−丙=1，甲比丙大 1 岁。"},
        {"type":"直觉陷阱","title":"一个人 8 元买只鸡、9 元卖出，又 10 元买回、11 元卖出。最终他赚了多少钱？","options":["1 元","2 元","3 元","没赚"],"answer":1,"explain":"两笔买卖各赚 1 元：(9−8)+(11−10)=1+1=2 元。"},
        {"type":"直觉陷阱","title":"时钟敲 6 下用了 5 秒，敲 12 下要用多少秒？","options":["10 秒","11 秒","12 秒","6 秒"],"answer":1,"explain":"敲 6 下之间有 5 个间隔用 5 秒，即每个间隔 1 秒；敲 12 下有 11 个间隔，共 11 秒。"},
        {"type":"演绎推理","title":"100 人中，70 人会英语，65 人会日语，每人至少会其中一种。两种语言都会的有多少人？","options":["30 人","35 人","40 人","65 人"],"answer":1,"explain":"两集合相加 70+65=135，比总人数多出的 35 人就是两种都会、被重复计算的部分。"},
        {"type":"演绎推理","title":"红、黄、绿三个盒子，只有一个盒子里有奖品。红盒说“在黄盒里”，黄盒说“不在我这”，绿盒说“不在我这”。三句话中只有一句是真的。奖品在哪个盒子？","options":["红盒","黄盒","绿盒","无法确定"],"answer":2,"explain":"红盒与黄盒的话正好矛盾，必有一真一假，已占用唯一真话；故绿盒“不在我这”是假话，奖品就在绿盒。"}
      ]
    }
  ]
}
</script>

<script>
const DATA = JSON.parse(document.getElementById('qdata').textContent);
const LEVELS = DATA.levels;
const LETTERS = ['A','B','C','D'];
const CIRC = 2 * Math.PI * 82;

/* 各能力标签（用于点评与建议） */
const ABILITY_LABEL = {
  '数字规律':'数字规律','类比推理':'类比推理','逻辑推理':'逻辑推理',
  '直觉陷阱':'反直觉','空间想象':'空间想象','演绎推理':'演绎推理'
};
const ADVICE = {
  '数字规律':'把相邻两项的差、比值先写出来，常见是等差/等比/平方/前两项求和，动笔就能看出规律。',
  '类比推理':'先想清楚题干两个词到底是什么关系（包含、场所、工具、因果），再用同样关系套选项。',
  '逻辑推理':'遇到“有些……有些……”“如果……就……”先画个圈或举极端例子，别被话术带着走。',
  '直觉陷阱':'这类题第一眼答案往往是错的，把数字设成未知数列式，或把“间隔/基数”想清楚再选。',
  '空间想象':'光脑补容易乱，拿纸条折一折、在纸上画个钟面或示意图，立刻清楚。',
  '演绎推理':'把每个条件列成不等式或表格，逐条排除，答案会自己浮出来。'
};

let levelIdx = -1, questions = [], answers = [], index = 0, seconds = 0, timer = null;

const $ = id => document.getElementById(id);

/* ---------- 开始页：难度选择 ---------- */
function renderModes(){
  const box = $('modeBox');
  box.innerHTML = LEVELS.map((lv,i)=>{
    const best = localStorage.getItem('iq_best_'+lv.key);
    const ico = lv.key==='easy' ? '🌱' : lv.key==='normal' ? '⚡' : '🔥';
    return `<div class="mode ${lv.key}" data-i="${i}">
      <div class="m-ico">${ico}</div>
      <div><div class="m-name">${lv.name}</div><div class="m-sub">${lv.sub}</div></div>
      <div class="m-best">${best!==null ? '最佳 '+best+' 分' : ''}</div>
    </div>`;
  }).join('');
  box.querySelectorAll('.mode').forEach(el=>{
    el.addEventListener('click', ()=>{
      levelIdx = +el.dataset.i;
      box.querySelectorAll('.mode').forEach(m=>m.style.boxShadow='');
      el.style.boxShadow = '0 0 0 2px '+LEVELS[levelIdx].color+' inset, 0 0 22px '+LEVELS[levelIdx].color+'55';
      const b = $('btnStart');
      b.disabled = false; b.style.opacity = '1';
      b.textContent = '开始【'+LEVELS[levelIdx].name+'】挑战';
    });
  });
}

function startQuiz(){
  $('start').scrollTop = 0; $('result').scrollTop = 0;
  const lv = LEVELS[levelIdx];
  questions = lv.questions;
  answers = new Array(questions.length).fill(-1);
  index = 0; seconds = 0;
  $('lvlTag').textContent = lv.name;
  $('lvlTag').style.color = lv.color;
  $('lvlTag').style.border = '1px solid '+lv.color+'66';
  $('qTotal').textContent = questions.length;
  $('start').classList.add('hide');
  $('result').classList.add('hide');
  $('hud').classList.add('show');
  clearInterval(timer);
  timer = setInterval(()=>{ seconds++; $('timer').textContent = fmt(seconds); }, 1000);
  $('timer').textContent = '00:00';
  renderQ();
}

function fmt(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }

function renderQ(){
  const q = questions[index];
  $('qNo').textContent = index+1;
  $('progress').style.width = ((index)/questions.length*100)+'%';
  $('qType').textContent = q.type;
  $('qTitle').textContent = q.title;
  $('optBox').innerHTML = q.options.map((op,i)=>`
    <div class="opt ${answers[index]===i?'sel':''}" data-i="${i}">
      <div class="key">${LETTERS[i]}</div><div class="txt">${op}</div>
    </div>`).join('');
  $('optBox').querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      answers[index] = +el.dataset.i;
      $('optBox').querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel');
    });
  });
  $('btnPrev').disabled = index===0;
  $('btnNext').textContent = index===questions.length-1 ? '交卷' : '下一题';
}

/* ---------- 提交与评分 ---------- */
function tryNext(){
  if(index < questions.length-1){ index++; renderQ(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  const unanswered = answers.filter(a=>a===-1).length;
  const go = ()=>{ clearInterval(timer); showResult(); };
  if(unanswered>0){
    if(confirm('还有 '+unanswered+' 题没作答，未作答将按答错处理。确定交卷吗？')) go();
  } else go();
}
function goPrev(){ if(index>0){ index--; renderQ(); } }

function gradeOf(ratio, allRight){
  if(allRight) return {name:'逻辑大神 👑', desc:'满分通关！推理又快又稳，这套题已经难不倒你了。'};
  if(ratio>=0.9) return {name:'思维敏捷 🔥', desc:'非常出色，只剩极少数细节，再细心一点就是满分。'};
  if(ratio>=0.7) return {name:'相当不错 💪', desc:'逻辑底子很好，放慢一步、避开直觉陷阱会更强。'};
  if(ratio>=0.5) return {name:'正常水平 🙂', desc:'基础推理没问题，多练规律和空间题就能明显提升。'};
  return {name:'继续加油 🌱', desc:'别灰心，逻辑是可以练出来的，先从简单档多刷几套。'};
}

function speedInfo(sec, total){
  const avg = sec/total;
  if(avg<=12) return {stars:5, text:'思维飞快', pct:100};
  if(avg<=20) return {stars:4, text:'反应很快', pct:82};
  if(avg<=32) return {stars:3, text:'节奏稳健', pct:64};
  if(avg<=45) return {stars:2, text:'从容作答', pct:44};
  return {stars:1, text:'慢工出细活', pct:26};
}

function buildReport(){
  const total = questions.length;
  let score = 0;
  const review = questions.map((q,i)=>{
    const chosen = answers[i];
    const correct = chosen===q.answer;
    if(correct) score++;
    return {
      id:i+1, type:q.type, title:q.title, correct,
      chosen:chosen, chosenLetter:chosen>=0?LETTERS[chosen]:'未答',
      answerLetter:LETTERS[q.answer],
      optionViews:q.options.map((op,oi)=>({
        letter:LETTERS[oi], text:op,
        isAns:oi===q.answer, isPick:chosen===oi
      })),
      explain:q.explain
    };
  });
  const hundred = Math.round(score/total*100);
  const grade = gradeOf(score/total, score===total);
  const speed = speedInfo(seconds,total);

  // 能力分组
  const types = ['数字规律','类比推理','逻辑推理','直觉陷阱','空间想象','演绎推理'];
  const ability = types.map(t=>{
    const items = review.filter(r=>r.type===t);
    if(items.length===0) return null;
    const right = items.filter(r=>r.correct).length;
    const pct = Math.round(right/items.length*100);
    let cm;
    if(pct===100) cm='强项，稳';
    else if(pct>=50) cm='差一点细节';
    else cm='重点提升';
    return {type:t,label:ABILITY_LABEL[t],right,count:items.length,pct,cm,perfect:pct===100};
  }).filter(Boolean);

  // 脑力标签
  const tags = [];
  if(score===total) tags.push('满分王者');
  if(speed.stars>=4 && score/total>=0.6) tags.push('快手答题');
  const tagMap = {'数字规律':'数列达人','类比推理':'类比大师','逻辑推理':'逻辑达人','直觉陷阱':'反套路高手','空间想象':'空间建筑师','演绎推理':'推理侦探'};
  const weakMap = {'数字规律':'数列待加强','类比推理':'类比待加强','逻辑推理':'逻辑待加强','直觉陷阱':'易被直觉带偏','空间想象':'空间想象待加强','演绎推理':'推理待加强'};
  ability.forEach(a=>{
    if(a.count>=1){
      if(a.perfect) tags.push(tagMap[a.type]);
      else if(a.pct<50) tags.push(weakMap[a.type]);
    }
  });
  if(tags.length===0) tags.push('潜力之星');
  const uniqTags = [...new Set(tags)].slice(0,5);

  // 提升建议
  const wrongTypes = [...new Set(review.filter(r=>!r.correct).map(r=>r.type))];
  const adviceTitle = wrongTypes.length===0 ? '给你的评价' : '给你的提升建议';
  const advice = wrongTypes.length===0
    ? ['全部答对，逻辑非常扎实！可以去更高一档难度继续挑战自己。']
    : wrongTypes.map(t=>'【'+ABILITY_LABEL[t]+'】'+ADVICE[t]);

  return {total,score,hundred,grade,speed,ability,tags:uniqTags,adviceTitle,advice,review,avg:Math.round(seconds/total)};
}

function showResult(){
  const r = buildReport();
  window._lastReport = r;
  $('rSub').textContent = '满分 100 · '+r.score+'/'+r.total+' 正确 · 用时 '+fmt(seconds);
  $('rGrade').textContent = r.grade.name;
  $('rDesc').textContent = r.grade.desc + '（'+LEVELS[levelIdx].name+'档）';
  $('rTags').innerHTML = r.tags.map(t=>'<span class="tag hot">'+t+'</span>').join('');
  $('speedBar').style.width = r.speed.pct+'%';
  $('speedText').textContent = '★'.repeat(r.speed.stars)+'☆'.repeat(5-r.speed.stars)+' '+r.speed.text;

  $('abilityBox').innerHTML = r.ability.map(a=>
    `<div class="ability ${a.perfect?'good':(a.pct<50?'bad':'')}">
      <div class="an">${a.label}</div>
      <div class="track"><i style="width:${a.pct}%"></i></div>
      <div class="av">${a.right}/${a.count}</div>
      <div class="acm">${a.cm}</div>
    </div>`).join('');

  $('adviceTitle').textContent = r.adviceTitle;
  $('adviceBox').innerHTML = r.advice.map(a=>'• '+a).join('<br>');

  $('reviewBox').innerHTML = r.review.map(it=>
    `<div class="ritem ${it.correct?'ok':'no'}">
      <div class="rhead"><span class="rk">第 ${it.id} 题</span><span class="rt2">${it.type}</span><span class="rs">${it.correct?'✓ 答对':'✕ '+it.chosenLetter+' / 正解 '+it.answerLetter}</span></div>
      <div class="rq">${it.title}</div>
      ${it.optionViews.map(o=>`<div class="rop ${o.isAns?'isAns':''} ${(o.isPick&&!o.isAns)?'isPick':''}"><span class="lk">${o.letter}.</span><span>${o.text}</span>${o.isAns?'　✔':''}${(o.isPick&&!o.isAns)?'　✘':''}</div>`).join('')}
      <div class="why"><b>解析：</b>${it.explain}</div>
    </div>`).join('');

  // 最高分（按模式分别记录）
  const key = 'iq_best_'+LEVELS[levelIdx].key;
  const best = localStorage.getItem(key);
  if(best===null || r.hundred>+best) localStorage.setItem(key, r.hundred);

  $('result').classList.remove('hide');
  $('result').scrollTop = 0;
  $('hud').classList.remove('show');
  window.scrollTo(0,0);

  // 分数 + 圆环动画
  animateNum($('rScore'), 0, r.hundred, 900);
  const fg = $('ringFg');
  fg.style.transition='none'; fg.style.strokeDashoffset = CIRC;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    fg.style.transition='stroke-dashoffset 1s ease';
    fg.style.strokeDashoffset = CIRC*(1-r.hundred/100);
  }));
}

function animateNum(el,from,to,dur){
  const t0 = performance.now();
  function step(t){
    const p = Math.min(1,(t-t0)/dur);
    el.textContent = Math.round(from+(to-from)*p);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------- 分享 / 重玩 ---------- */
function shareScore(){
  const r = window._lastReport; if(!r) return;
  const txt = '【逻辑思维测试·'+LEVELS[levelIdx].name+'档】我答对 '+r.score+'/'+r.total+'，综合评分 '+r.hundred+' 分，获得「'+r.grade.name+'」，速度评价：'+r.speed.text+'（平均每题 '+r.avg+' 秒）。你也来挑战一下？';
  const done=()=>toast('成绩已复制，去粘贴给朋友吧 📋');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));
  } else fallbackCopy(txt,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done();}catch(e){toast('复制失败，可截图分享');}
  document.body.removeChild(ta);

  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawPoster(){
  const r = window._lastReport; if(!r) return;
  const cv = $('posterCanvas'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  // bg gradient
  const bg = ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#0b1020'); bg.addColorStop(0.55,'#161238'); bg.addColorStop(1,'#241a55');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  // glow blobs
  let gl = ctx.createRadialGradient(150,180,10,150,180,360);
  gl.addColorStop(0,'rgba(91,108,255,.35)'); gl.addColorStop(1,'rgba(91,108,255,0)');
  ctx.fillStyle = gl; ctx.fillRect(0,0,W,H);
  gl = ctx.createRadialGradient(620,1080,10,620,1080,380);
  gl.addColorStop(0,'rgba(122,77,255,.30)'); gl.addColorStop(1,'rgba(122,77,255,0)');
  ctx.fillStyle = gl; ctx.fillRect(0,0,W,H);
  // icon (circular)
  const cx = W/2, iy = 210, ir = 92;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,iy,ir,0,Math.PI*2); ctx.clip();
  if(_posterImgOk){ ctx.drawImage(_posterImg,cx-ir,iy-ir,ir*2,ir*2); }
  else {
    const ig = ctx.createLinearGradient(cx-ir,iy-ir,cx+ir,iy+ir);
    ig.addColorStop(0,'#00d4ff'); ig.addColorStop(1,'#7a4dff');
    ctx.fillStyle = ig; ctx.fillRect(cx-ir,iy-ir,ir*2,ir*2);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 96px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🧠',cx,iy+4);
  }
  ctx.restore();
  ctx.lineWidth = 4; ctx.strokeStyle='rgba(124,211,255,.8)'; ctx.beginPath(); ctx.arc(cx,iy,ir,0,Math.PI*2); ctx.stroke();
  // title
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillStyle='#ffffff'; ctx.font='bold 52px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('逻辑思维测试', cx, 360);
  ctx.fillStyle='#9fb0e8'; ctx.font='26px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(LEVELS[levelIdx].name + '档 · ' + r.score + '/' + r.total + ' 正确', cx, 408);
  // main card
  const cardX=60, cardY=450, cardW=W-120, cardH=700;
  ctx.fillStyle='rgba(255,255,255,.06)';
  rr(ctx,cardX,cardY,cardW,cardH,28); ctx.fill();
  ctx.strokeStyle='rgba(124,150,255,.25)'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='#9fb0e8'; ctx.font='28px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('综合评分', cx, cardY+70);
  // big number
  ctx.fillStyle='#ffffff'; ctx.font='bold 130px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(String(r.hundred), cx-14, cardY+210);
  ctx.fillStyle='#7cd3ff'; ctx.font='bold 40px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='left'; ctx.fillText('分', cx+92, cardY+196);
  ctx.textAlign='center';
  // grade
  ctx.fillStyle='#ffd35c'; ctx.font='bold 40px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(r.grade.name, cx, cardY+290);
  ctx.fillStyle='#c6d2f5'; ctx.font='26px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('正确 ' + r.score + '/' + r.total + ' · 用时 ' + fmt(seconds) + ' · 平均每题 ' + r.avg + ' 秒', cx, cardY+338);
  ctx.fillText('速度：' + '★'.repeat(r.speed.stars) + '☆'.repeat(5-r.speed.stars) + '  ' + r.speed.text, cx, cardY+378);
  // tags
  const tags = r.tags.slice(0,3);
  ctx.font='24px "PingFang SC","Microsoft YaHei",sans-serif';
  let chipW = tags.map(t=>ctx.measureText(t).width+44);
  let gap=18, totW = chipW.reduce((a,b)=>a+b,0)+gap*(tags.length-1);
  let tx = cx - totW/2, tyy = cardY+425;
  tags.forEach((t,i)=>{
    const w=chipW[i];
    const g=ctx.createLinearGradient(tx,tyy,tx+w,tyy+44);
    g.addColorStop(0,'rgba(91,108,255,.35)'); g.addColorStop(1,'rgba(122,77,255,.35)');
    ctx.fillStyle=g; rr(ctx,tx,tyy,w,44,22); ctx.fill();
    ctx.strokeStyle='rgba(124,211,255,.5)'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle='#dfe7ff'; ctx.textBaseline='middle'; ctx.textAlign='center';
    ctx.fillText(t, tx+w/2, tyy+23);
    ctx.textBaseline='alphabetic';
    tx += w+gap;
  });
  // ability bars
  ctx.fillStyle='#9fb0e8'; ctx.font='24px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='left';
  ctx.fillText('能力分布', cardX+40, cardY+520);
  const ab = r.ability.slice(0,6);
  const bx=cardX+40, trackX=cardX+200, trackW=cardW-200-130, by0=cardY+555, bh=16, bs=38;
  ab.forEach((a,i)=>{
    const y=by0+i*bs;
    ctx.fillStyle='#aebae0'; ctx.font='22px "PingFang SC","Microsoft YaHei",sans-serif'; ctx.textBaseline='middle';
    ctx.fillText(a.label, bx, y+9);
    ctx.fillStyle='rgba(255,255,255,.12)'; rr(ctx,trackX,y-7,trackW,bh+4,bh/2+2); ctx.fill();
    const g2=ctx.createLinearGradient(trackX,0,trackX+trackW,0);
    g2.addColorStop(0,'#00d4ff'); g2.addColorStop(1,'#7a4dff');
    ctx.fillStyle=g2;
    const wd=Math.max(6, trackW*a.pct/100);
    rr(ctx,trackX,y-7,wd,bh+4,bh/2+2); ctx.fill();
    ctx.fillStyle='#c6d2f5'; ctx.font='20px sans-serif'; ctx.textAlign='right';
    ctx.fillText(a.right+'/'+a.count, cardX+cardW-40, y+9);
    ctx.textAlign='left';
  });
  ctx.textBaseline='alphabetic';
  // footer
  ctx.textAlign='center';
  ctx.fillStyle='#ffffff'; ctx.font='bold 34px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('敢不敢来挑战我的脑力？', cx, H-92);
  ctx.fillStyle='#8593c4'; ctx.font='24px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('趣味逻辑测验 · 成绩仅保存在本设备', cx, H-48);
}
function openPoster(){
  if(!window._lastReport) return;
  const mask=$('posterMask'); mask.classList.remove('hide'); mask.scrollTop=0;
  drawPoster();
}
function savePoster(){
  const cv=$('posterCanvas');
  const a=document.createElement('a');
  a.download='逻辑思维成绩-'+window._lastReport.hundred+'分.png';
  a.href=cv.toDataURL('image/png');
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('海报已生成，开始下载 🖼');
}
document.addEventListener('DOMContentLoaded', ()=>{});
$('btnPoster').addEventListener('click', openPoster);
$('btnPosterClose').addEventListener('click', ()=>$('posterMask').classList.add('hide'));
$('btnPosterSave').addEventListener('click', savePoster);
$('posterMask').addEventListener('click', (e)=>{ if(e.target===$('posterMask')) $('posterMask').classList.add('hide'); });

let toastTimer=null;
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ---------- 事件绑定 ---------- */
$('btnStart').addEventListener('click', startQuiz);
$('btnNext').addEventListener('click', tryNext);
$('btnPrev').addEventListener('click', goPrev);
$('btnAgain').addEventListener('click', ()=>{ $('result').classList.add('hide'); startQuiz(); });
$('btnHome').addEventListener('click', ()=>{
  $('result').classList.add('hide'); $('start').classList.remove('hide');
  $('start').scrollTop = 0;
  renderModes();
});
$('btnShare').addEventListener('click', shareScore);

renderModes();
</script>
